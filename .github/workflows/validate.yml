name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate configuration
        run: bin/spark3 doctor
      - name: Compile helper
        run: python3 -m py_compile bin/spark3
      - name: Validate shell helpers
        run: |
          find scripts -type f -print0 | xargs -0 -n1 bash -n
          find experiments -type f -name 'prepare-sources' -print0 \
            | while IFS= read -r -d '' file; do
                case "$(head -n1 "$file")" in
                  *python*) python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])' "$file" ;;
                  *) sh -n "$file" ;;
                esac
              done
      - name: Validate JSON and patches
        run: |
          git diff --check
          find config manifests experiments -name '*.json' -print0 \
            | xargs -0 -n1 python3 -m json.tool >/dev/null

  patch-stacks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        source: [vllm, b12x]
    steps:
      - uses: actions/checkout@v5
      - name: Apply pinned upstream and local series
        run: bin/spark3 upstream prepare "${{ matrix.source }}"
      - name: Reject whitespace errors
        run: |
          git -C ".work/upstreams/${{ matrix.source }}" diff --check
          git -C ".work/upstreams/${{ matrix.source }}" diff --cached --check
