[Service]
# Preserve the normal display-manager handoff, but never let a missing Plymouth
# quit event hold multi-user.target indefinitely.
ExecStart=
ExecStart=/usr/bin/timeout --signal=TERM --kill-after=5s 30s /usr/bin/plymouth --wait
ExecStartPost=-/usr/bin/plymouth quit
TimeoutSec=40s
SuccessExitStatus=124
